plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.tartalabs.emotiondetection.emotion_detection_example"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.tartalabs.emotiondetection.emotion_detection_example"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.mlkit:vision-common:17.3.0'
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.3.0'
    implementation "com.google.android.gms:play-services-tasks:17.0.0"
    implementation "org.tensorflow:tensorflow-lite-select-tf-ops:2.3.0"
    implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.0'
    //implementation 'com.microsoft.onnxruntime:onnxruntime-android:latest.release'
}

flutter {
    source = "../.."
}

["Debug", "Profile", "Release"].each { variantName ->
    def variantDirName = variantName.substring(0, 1).toLowerCase(Locale.ROOT) +
            variantName.substring(1)
    def packagedResourceDir = "${rootProject.buildDir}/app/intermediates/packaged_res/" +
            "${variantDirName}/package${variantName}Resources"
    def mergedAssetDir = "${rootProject.buildDir}/app/intermediates/assets/" +
            "${variantDirName}/merge${variantName}Assets"
    def stripAppleDoubleFiles = { String dirPath ->
        def root = file(dirPath)
        if (!root.exists()) {
            return
        }
        def sidecars = []
        root.eachFileRecurse { candidate ->
            if (candidate.name.startsWith("._")) {
                sidecars.add(candidate)
            }
        }
        sidecars.reverseEach { sidecar ->
            delete sidecar
        }
    }

    def stripPackagedResources = tasks.register(
            "strip${variantName}AppleDoubleResources") {
        group = "build"
        description = "Strip AppleDouble files from packaged ${variantName} resources."
        dependsOn("package${variantName}Resources")
        outputs.upToDateWhen { false }
        doLast {
            stripAppleDoubleFiles(packagedResourceDir)
        }
    }

    tasks.matching { it.name == "parse${variantName}LocalResources" }.configureEach {
        dependsOn(stripPackagedResources)
    }

    def stripMergedAssetsBeforeClean = tasks.register(
            "strip${variantName}AppleDoubleAssetsBeforeClean") {
        group = "build"
        description = "Strip AppleDouble files before cleaning merged ${variantName} assets."
        outputs.upToDateWhen { false }
        doLast {
            stripAppleDoubleFiles(mergedAssetDir)
        }
    }

    tasks.matching { it.name == "cleanMerge${variantName}Assets" }.configureEach {
        dependsOn(stripMergedAssetsBeforeClean)
    }

    def stripMergedAssetsAfterMerge = tasks.register(
            "strip${variantName}AppleDoubleAssetsAfterMerge") {
        group = "build"
        description = "Strip AppleDouble files from merged ${variantName} assets."
        dependsOn("merge${variantName}Assets")
        outputs.upToDateWhen { false }
        doLast {
            stripAppleDoubleFiles(mergedAssetDir)
        }
    }

    tasks.matching { it.name == "compress${variantName}Assets" }.configureEach {
        dependsOn(stripMergedAssetsAfterMerge)
    }
}
