group = "com.tartalabs.emotiondetection.emotion_detection"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "maven-publish"

def flutterRoot = System.getenv("FLUTTER_ROOT")
def flutterEmbeddingJar = flutterRoot == null ? null : file("$flutterRoot/bin/cache/artifacts/engine/android-x64/flutter.jar")

android {
    namespace = "com.tartalabs.emotiondetection.emotion_detection"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
        implementation 'com.google.mlkit:vision-common:17.3.0'
        implementation 'org.tensorflow:tensorflow-lite:2.16.1'
        implementation 'org.tensorflow:tensorflow-lite-gpu:2.3.0'
        implementation "com.google.android.gms:play-services-tasks:17.0.0"
        implementation "org.tensorflow:tensorflow-lite-select-tf-ops:2.3.0"
        implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.0'
        if (flutterEmbeddingJar != null && flutterEmbeddingJar.exists()) {
            compileOnly files(flutterEmbeddingJar)
        }

        testImplementation("org.jetbrains.kotlin:kotlin-test-junit5")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

["Debug", "Profile", "Release"].each { variantName ->
    def variantDirName = variantName.substring(0, 1).toLowerCase(Locale.ROOT) +
            variantName.substring(1)
    def packagedResourceDir = "${buildDir}/intermediates/packaged_res/" +
            "${variantDirName}/package${variantName}Resources"
    def stripAppleDoubleFiles = { String dirPath ->
        def root = file(dirPath)
        if (!root.exists()) {
            return
        }
        def sidecars = []
        root.eachFileRecurse { candidate ->
            if (candidate.name.startsWith("._")) {
                sidecars.add(candidate)
            }
        }
        sidecars.reverseEach { sidecar ->
            delete sidecar
        }
    }

    def stripPackagedResources = tasks.register(
            "strip${variantName}AppleDoubleResources") {
        group = "build"
        description = "Strip AppleDouble files from packaged ${variantName} resources."
        dependsOn("package${variantName}Resources")
        outputs.upToDateWhen { false }
        doLast {
            stripAppleDoubleFiles(packagedResourceDir)
        }
    }

    tasks.matching { it.name == "parse${variantName}LocalResources" }.configureEach {
        dependsOn(stripPackagedResources)
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = "emotion-native-sdk-android"
                version = project.version
                pom {
                    name = "Emotion Native SDK Android"
                    description = "Android SDK wrapper for the emotion detection native runtime."
                }
            }
        }
    }
}
