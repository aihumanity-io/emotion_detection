name: Flutter

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Analyze
        run: flutter analyze

      - name: Publish dry-run
        run: flutter pub publish --dry-run

  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Configure native SDK
        run: cmake --preset host-release

      - name: Build native SDK
        run: cmake --build --preset host-release --parallel

      - name: Test native SDK
        run: ctest --preset host-release

  native-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Configure native SDK
        run: >
          cmake -S native -B build/native-windows
          -G "Visual Studio 17 2022" -A x64
          -DEMOTION_SDK_BUILD_TESTS=ON
          -DEMOTION_SDK_BUILD_INSTALLABLE=ON
          -DEMOTION_ENABLE_ONNX_RUNTIME=OFF

      - name: Build native SDK
        run: cmake --build build/native-windows --config Release --parallel

      - name: Test native SDK
        run: ctest --test-dir build/native-windows -C Release --output-on-failure
