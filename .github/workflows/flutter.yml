name: Flutter

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Analyze
        run: flutter analyze

      - name: Publish dry-run
        run: flutter pub publish --dry-run

  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Configure native SDK
        run: cmake --preset host-release

      - name: Build native SDK
        run: cmake --build --preset host-release --parallel

      - name: Test native SDK
        run: ctest --preset host-release
